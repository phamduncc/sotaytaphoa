name: sotaytaphoa
description: "Sổ Tay Tạp Hóa - Ứng dụng quản lý cửa hàng tạp hóa"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  provider: ^6.1.2
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  fl_chart: ^0.68.0
  pdf: ^3.11.1
  printing: ^5.13.1
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: false
